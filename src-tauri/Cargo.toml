[package]
name = "winagent"
version = "0.2.3"
description = "Windows AI Agent — OpenAI compatible + local Ollama, built-in Windows tools, LLM Wiki"
authors = ["WinAgent"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "winagent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
notify = "7"
walkdir = "2"
zip = "2"
calamine = "0.26"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
regex = "1"
glob = "0.3"
encoding_rs = "0.8"
base64 = "0.22"

windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
