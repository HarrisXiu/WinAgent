appId: com.winagent.app
productName: WinAgent
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: skills
    to: skills
  - from: mcp.json
    to: mcp.json
win:
  target:
    - target: zip
      arch:
        - x64
  icon: build/icon.ico
  artifactName: WinAgent-${version}-win64.zip
compression: maximum
npmRebuild: false
