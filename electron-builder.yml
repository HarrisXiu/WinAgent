appId: com.winagent.app
productName: WinAgent
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  - third-party/**/*
  # dsh-winagent 服务层（file: 依赖，symlink 解引用后打包；assets/skills 随包播种到 userData）
  - node_modules/dsh-winagent/**/*
win:
  target:
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
  artifactName: WinAgent-${version}-win64.exe
portable:
  # 解压阶段启动图（portable 每次双击都要先解压，Electron 还没起来）：
  # 由 scripts/build-splash.cjs 从 src/main/splash.html 渲染，与运行时启动窗同款
  splashImage: build/splash.bmp
# normal 而非 maximum：portable 每次启动都要解压，maximum 解压明显更慢，体积仅略小
compression: normal
npmRebuild: false
