appId: com.winagent.app
productName: WinAgent
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  # dsh-winagent 服务层（file: 依赖，symlink 解引用后打包；assets/skills 随包播种到 userData）
  - node_modules/dsh-winagent/**/*
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: WinAgent-Setup-${version}-win64.exe
  # 内置 rcedit 在打包后立即改写 exe 资源会因 Defender 句柄时序失败，
  # 跳过之，由 scripts/edit-exe-resources.js 在打包完成后带重试完成资源写入
  signAndEditExecutable: false
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  artifactName: WinAgent-Setup-${version}-win64.exe
compression: maximum
npmRebuild: false
afterPack: scripts/edit-exe-resources.js
