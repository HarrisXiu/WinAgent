<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: asset: http://asset.localhost; media-src 'self' data:; worker-src 'self' blob:; object-src 'none'; connect-src 'self' ipc: http://ipc.localhost" />
    <title>WinAgent</title>
    <!-- 启动占位：主窗口首帧（ready-to-show）到 React 挂载之间显示；createRoot().render 会整体替换 #root 内容。
         CSP 禁止内联脚本，故纯 CSS；底色透明（透出主进程按主题设置的窗口背景），中性灰适配任何主色与亮暗。 -->
    <style>
      .boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;animation:boot-in .4s .15s both}
      .boot-icon{width:52px;height:52px;border-radius:12px;background:rgba(142,142,147,.16);display:flex;align-items:center;justify-content:center}
      .boot-icon svg{width:28px;height:28px;fill:#8e8e93}
      .boot-bar{width:120px;height:3px;border-radius:3px;background:rgba(142,142,147,.18);overflow:hidden}
      .boot-bar i{display:block;width:40%;height:100%;border-radius:3px;background:rgba(142,142,147,.7);animation:boot-slide 1.1s cubic-bezier(.45,0,.55,1) infinite}
      @keyframes boot-in{from{opacity:0}to{opacity:1}}
      @keyframes boot-slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" aria-label="正在加载" role="status"><div class="boot-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c.55 4.9 4.1 8.45 9 9-4.9.55-8.45 4.1-9 9-.55-4.9-4.1-8.45-9-9 4.9-.55 8.45-4.1 9-9Z"/></svg></div><div class="boot-bar"><i></i></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
